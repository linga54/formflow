<h1>Submitted Information</h1>

@if (data) {
  <table>
    <thead>
      <tr>
        <th>First name</th>
        <th>Last name</th>
        <th>Phone number</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ data.firstName }}</td>
        <td>{{ data.lastName }}</td>
        <td>{{ data.phone }}</td>
        <td>{{ data.email }}</td>
      </tr>
    </tbody>
  </table>
} @else {
  <p>No data has been submitted yet.</p>
}
